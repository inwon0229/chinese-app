<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="中文学习">
<meta name="theme-color" content="#F0F7FF">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>中文学习 · 중국어 학습</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+SC:wght@400;500;700&display=swap');
:root {
  --green:#58CC02;--green-dark:#46A302;--blue:#1CB0F6;--blue-dark:#0E9BD8;
  --red:#FF4B4B;--orange:#FF9600;--yellow:#FFC800;--purple:#CE82FF;
  --bg:#F0F7FF;--card:#FFFFFF;--card2:#EAF4FF;--text:#3C3C3C;--muted:#8A9BB0;--border:#D8E8F5;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;align-items:center;
  min-height:100vh;min-height:-webkit-fill-available;
  padding-bottom:env(safe-area-inset-bottom);overflow-x:hidden;}

.page{display:none;width:100%;max-width:480px;flex:1;flex-direction:column;}
.page.active{display:flex;}

nav{width:100%;max-width:480px;display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;position:sticky;top:0;background:#fff;z-index:200;
  box-shadow:0 2px 12px rgba(0,0,0,.08);}
.nav-logo{font-size:20px;font-weight:900;color:var(--green);letter-spacing:-1px;}
.nav-stats{display:flex;gap:14px;align-items:center;}
.nav-stat{display:flex;align-items:center;gap:5px;font-weight:800;font-size:15px;}
.nav-stat.streak{color:var(--orange);}.nav-stat.xp{color:var(--yellow);}
.nav-gear{width:36px;height:36px;border-radius:50%;border:2px solid var(--border);
  background:var(--card);display:flex;align-items:center;justify-content:center;
  font-size:16px;cursor:pointer;transition:all .2s;}

/* ── HOME ── */
#page-home{overflow-y:auto;background:linear-gradient(180deg,#E8F5FF 0%,#F0F7FF 50%,#F0FFF0 100%);}

.section-block{padding:0 16px;margin-bottom:0;}

.section-banner{border-radius:16px;padding:14px 18px;margin:20px 0 8px;
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(135deg,#58CC02,#3da800);
  box-shadow:0 4px 20px rgba(88,204,2,.3);}
.section-banner.locked{background:linear-gradient(135deg,#B0C8DC,#90AABC);box-shadow:none;}
.sb-title{font-size:16px;font-weight:900;color:#fff;}
.sb-sub{font-size:11px;font-weight:700;color:rgba(255,255,255,.85);margin-top:2px;}
.sb-badge{font-size:12px;font-weight:800;color:rgba(255,255,255,.95);
  background:rgba(0,0,0,.18);padding:3px 10px;border-radius:100px;}

/* map container — uses canvas for the curve */
.map-container{position:relative;width:100%;}
.map-canvas{position:absolute;top:0;left:0;width:100%;pointer-events:none;}

.word-node{width:72px;height:72px;border-radius:50%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;cursor:pointer;transition:transform .15s,box-shadow .15s;
  position:absolute;border:3px solid transparent;}
.word-node:active{transform:translateY(3px)!important;}
.word-node.s0{background:#E8EFF5;border-color:#C8D8E8;box-shadow:0 5px 0 #B0C4D4;}
.word-node.s1{background:#DFF2FD;border-color:var(--blue);box-shadow:0 5px 0 #9DD8F5;}
.word-node.s2{background:#FFFACD;border-color:var(--yellow);box-shadow:0 5px 0 #D4B800;}
.word-node.s3{background:#DFFFD8;border-color:var(--green);box-shadow:0 5px 0 #8DC850;}
.word-node.slk{background:#F0F0F0;border-color:#D0D0D0;opacity:.45;cursor:default;box-shadow:0 5px 0 #C0C0C0;}
.word-node.glow{animation:glow .9s ease-in-out infinite alternate;}
@keyframes glow{
  from{box-shadow:0 5px 0 #8DC850,0 0 0 0 rgba(88,204,2,0);}
  to  {box-shadow:0 5px 0 #8DC850,0 0 16px 6px rgba(88,204,2,.45);}
}
.n-ico{font-size:17px;margin-bottom:1px;}
.n-lbl{font-family:'Noto Sans SC',sans-serif;font-size:11px;font-weight:700;
  text-align:center;line-height:1.2;color:#3C3C3C;max-width:64px;}
.n-lbl.dim{color:#B0C0CC;}

.node-dots{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);
  display:flex;gap:3px;}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid #fff;}
.dot.dl{background:var(--blue);}.dot.dq{background:var(--yellow);}
.dot.ds{background:var(--green);}.dot.de{background:#D8E8F0;}

.map-legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;
  padding:14px 16px;margin:4px 16px 24px;
  background:rgba(255,255,255,.7);border-radius:14px;border:1px solid var(--border);}
.map-legend span{font-size:11px;font-weight:800;color:var(--muted);}

/* ── WORD DETAIL PAGE ── */
#page-word{overflow-y:auto;padding:0 0 60px;}

.word-page-inner{padding:16px 20px;}

.word-hdr{background:#fff;border-radius:20px;padding:20px;margin-bottom:12px;
  border:2px solid var(--border);position:relative;overflow:hidden;}
.word-hdr::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--green),var(--blue));}
.wh-back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);
  font-weight:800;font-size:13px;cursor:pointer;margin-bottom:12px;
  background:none;border:none;padding:0;}
.wh-back:hover{color:var(--text);}
.wh-zh{font-family:'Noto Sans SC',sans-serif;font-size:38px;font-weight:700;color:var(--text);}
.wh-py{color:var(--blue);font-weight:700;font-size:14px;margin:3px 0;}
.wh-ko{color:var(--muted);font-weight:600;font-size:13px;}

/* tabs — always visible, tab-panel switching */
.tabs-row{display:flex;gap:8px;margin-bottom:16px;}
.tab-btn{flex:1;padding:10px 4px;border-radius:14px;border:2px solid var(--border);
  background:#fff;text-align:center;font-size:12px;font-weight:800;
  color:var(--muted);cursor:pointer;transition:all .2s;font-family:'Nunito',sans-serif;}
.tab-btn.active{border-color:var(--blue);color:var(--blue);background:rgba(28,176,246,.08);}
.tab-btn.done{border-color:var(--green);color:var(--green);background:rgba(88,204,2,.07);}
.tab-btn.active.done{border-color:var(--green);color:var(--green);background:rgba(88,204,2,.12);}

.tab-panel{display:none;}.tab-panel.active{display:block;}

/* learn panel */
.sent-card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;
  border:1px solid var(--border);transition:border-color .2s;}
.sent-card.playing{border-color:var(--blue);background:rgba(28,176,246,.04);}
.s-zh{font-family:'Noto Sans SC',sans-serif;font-size:18px;font-weight:500;margin-bottom:3px;}
.s-py{font-size:12px;color:var(--blue);font-weight:600;margin-bottom:2px;}
.s-ko{font-size:12px;color:var(--muted);font-weight:600;}
.btn-listen{display:inline-flex;align-items:center;gap:5px;padding:5px 13px;
  border-radius:100px;border:2px solid var(--blue);background:transparent;
  color:var(--blue);font-family:'Nunito',sans-serif;font-weight:800;font-size:12px;
  cursor:pointer;transition:all .2s;margin-top:8px;}
.btn-listen.heard{border-color:var(--green);color:var(--green);}

/* quiz panel */
.quiz-top{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.pbar{flex:1;height:10px;background:var(--card2);border-radius:100px;overflow:hidden;}
.pfill{height:100%;background:var(--green);border-radius:100px;transition:width .4s;}
.qbadge{display:inline-block;padding:3px 11px;border-radius:100px;
  background:rgba(88,204,2,.12);color:var(--green);font-size:11px;
  font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;}
.qq{font-size:16px;font-weight:700;line-height:1.6;margin-bottom:14px;color:var(--text);}
.blank{display:inline-block;min-width:64px;height:26px;background:var(--card2);
  border-bottom:3px solid var(--green);border-radius:4px;vertical-align:middle;
  text-align:center;line-height:26px;font-weight:900;color:var(--green);
  font-family:'Noto Sans SC',sans-serif;font-size:16px;}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.choice{padding:12px 8px;background:var(--card2);border:2px solid var(--border);
  border-radius:14px;color:var(--text);font-family:'Nunito',sans-serif;font-weight:700;
  font-size:13px;cursor:pointer;transition:all .2s;text-align:center;}
.choice:hover:not(:disabled){border-color:var(--blue);background:rgba(28,176,246,.08);}
.choice.ok{border-color:var(--green);background:rgba(88,204,2,.1);color:var(--green);}
.choice.ng{border-color:var(--red);background:rgba(255,75,75,.07);color:var(--red);}
.choice:disabled{cursor:default;}
.rbox{border-radius:14px;padding:12px 14px;margin-bottom:10px;display:none;}
.rbox.show{display:block;}
.rbox.ok{background:rgba(88,204,2,.08);border:2px solid var(--green);}
.rbox.ng{background:rgba(255,75,75,.06);border:2px solid var(--red);}
.rtitle{font-weight:900;font-size:14px;margin-bottom:3px;}
.rbox.ok .rtitle{color:var(--green);}.rbox.ng .rtitle{color:var(--red);}
.rdetail{font-size:12px;color:var(--muted);font-weight:600;line-height:1.5;}

/* speak panel */
.speak-inner{background:#fff;border-radius:20px;padding:20px;
  border:2px solid var(--border);text-align:center;}
.mtoggle{display:flex;gap:6px;margin-bottom:16px;background:var(--card2);
  border-radius:12px;padding:4px;}
.mbtn{flex:1;padding:8px;border-radius:9px;border:none;background:transparent;
  color:var(--muted);font-family:'Nunito',sans-serif;font-weight:800;font-size:12px;cursor:pointer;}
.mbtn.active{background:var(--green);color:#fff;}
.spk-zh{font-family:'Noto Sans SC',sans-serif;font-size:26px;font-weight:700;margin:12px 0 4px;}
.spk-py{font-size:13px;color:var(--blue);font-weight:700;margin-bottom:4px;}
.spk-ko{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:14px;}
.mic-btn{width:70px;height:70px;border-radius:50%;border:none;background:var(--green);
  color:#fff;font-size:26px;cursor:pointer;transition:all .2s;
  box-shadow:0 4px 0 var(--green-dark);display:flex;align-items:center;
  justify-content:center;margin:0 auto 12px;}
.mic-btn.rec{background:var(--red);animation:pulse 1s infinite;box-shadow:0 4px 0 #cc0000;}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(255,75,75,.4),0 4px 0 #cc0000;}
  50%{box-shadow:0 0 0 14px rgba(255,75,75,0),0 4px 0 #cc0000;}
}
.spk-st{font-size:12px;font-weight:700;color:var(--muted);min-height:18px;margin-bottom:8px;}
.spk-st.good{color:var(--green);}.spk-st.bad{color:var(--red);}
.spk-res{background:var(--card2);border-radius:12px;padding:10px 12px;
  font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--border);
  margin-top:8px;display:none;text-align:left;}
.spk-res.show{display:block;}
.navbtns{display:flex;gap:8px;margin-top:10px;}
.btn-s{flex:1;padding:11px;background:transparent;border:2px solid var(--border);
  color:var(--muted);border-radius:14px;font-family:'Nunito',sans-serif;
  font-weight:800;font-size:13px;cursor:pointer;transition:all .2s;}
.btn-s:hover{border-color:var(--muted);color:var(--text);}

/* primary button */
.btn-p{width:100%;padding:15px;background:var(--green);color:#fff;border:none;
  border-radius:14px;font-family:'Nunito',sans-serif;font-weight:900;font-size:16px;
  cursor:pointer;transition:all .15s;box-shadow:0 4px 0 var(--green-dark);margin-top:10px;}
.btn-p:active{transform:translateY(2px);box-shadow:0 2px 0 var(--green-dark);}
.btn-p.red{background:var(--red);box-shadow:0 4px 0 #cc0000;}
.btn-p.red:active{box-shadow:0 2px 0 #cc0000;}

/* SETTINGS */
#page-settings{overflow-y:auto;padding:16px 20px 60px;}
.back-btn{display:inline-flex;align-items:center;gap:6px;color:var(--muted);
  font-weight:800;font-size:14px;cursor:pointer;margin-bottom:16px;background:none;border:none;padding:4px 0;}
.sec-lbl{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--muted);
  text-transform:uppercase;margin-bottom:12px;}
.voice-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px;}
.vchip{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:100px;
  border:2px solid var(--border);background:#fff;color:var(--muted);
  font-family:'Nunito',sans-serif;font-weight:700;font-size:12px;cursor:pointer;transition:all .2s;}
.vchip.active{border-color:var(--purple);background:rgba(206,130,255,.1);color:var(--purple);}
.spd-btns{display:flex;gap:6px;}
.spd-btn{padding:6px 12px;border-radius:100px;border:2px solid var(--border);
  background:transparent;color:var(--muted);font-family:'Nunito',sans-serif;
  font-weight:800;font-size:12px;cursor:pointer;transition:all .2s;}
.spd-btn.active{border-color:var(--blue);color:var(--blue);background:rgba(28,176,246,.1);}
.s-row{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:28px;
  border:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}

/* OVERLAY */
.overlay{position:fixed;inset:0;background:rgba(50,80,120,.75);
  display:none;align-items:center;justify-content:center;z-index:500;padding:24px;}
.overlay.show{display:flex;}
.ov-card{background:#fff;border-radius:24px;padding:28px 22px;
  text-align:center;width:100%;max-width:340px;border:2px solid var(--border);
  animation:pop .3s ease;}
@keyframes pop{from{transform:scale(.85);opacity:0;}to{transform:scale(1);opacity:1;}}
.ov-ico{font-size:56px;margin-bottom:12px;}
.ov-title{font-size:22px;font-weight:900;margin-bottom:5px;}
.ov-sub{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:18px;}
.ov-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:18px;}
.ov-stat{background:var(--card2);border-radius:12px;padding:10px 4px;}
.ov-val{font-size:18px;font-weight:900;color:var(--yellow);}
.ov-lbl{font-size:10px;font-weight:700;color:var(--muted);margin-top:2px;}

.xp-pop{position:fixed;top:64px;right:16px;background:var(--yellow);color:#000;
  font-weight:900;font-size:14px;padding:6px 14px;border-radius:100px;
  animation:xpa 1.5s ease forwards;pointer-events:none;z-index:999;}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:var(--green);color:#fff;font-weight:900;font-size:13px;
  padding:10px 20px;border-radius:100px;z-index:999;animation:xpa 2.2s ease forwards;
  white-space:nowrap;}
@keyframes xpa{
  0%{opacity:0;transform:translateX(-50%) translateY(8px) scale(.85);}
  15%{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}
  80%{opacity:1;}100%{opacity:0;transform:translateX(-50%) translateY(-16px);}
}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.page.active{animation:fadeIn .22s ease;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
</style>
</head>
<body>

<nav>
  <div class="nav-logo">中文</div>
  <div class="nav-stats">
    <div class="nav-stat streak">🔥<span id="xStreak">1</span></div>
    <div class="nav-stat xp">⭐<span id="xXp">0</span></div>
  </div>
  <div class="nav-gear" onclick="goSettings()">⚙️</div>
</nav>

<!-- HOME -->
<div class="page active" id="page-home"></div>

<!-- WORD DETAIL (learn + quiz + speak in tabs) -->
<div class="page" id="page-word">
  <div class="word-page-inner">
    <!-- header -->
    <div class="word-hdr">
      <button class="wh-back" onclick="goHome()">← 홈으로</button>
      <div class="wh-zh" id="wh-zh"></div>
      <div class="wh-py" id="wh-py"></div>
      <div class="wh-ko" id="wh-ko"></div>
    </div>
    <!-- tabs -->
    <div class="tabs-row">
      <button class="tab-btn active" id="tab-learn" onclick="switchTab('learn')">📖 학습</button>
      <button class="tab-btn" id="tab-quiz"  onclick="switchTab('quiz')">✏️ 퀴즈</button>
      <button class="tab-btn" id="tab-speak" onclick="switchTab('speak')">🎤 말하기</button>
    </div>
    <!-- panels -->
    <div class="tab-panel active" id="panel-learn"></div>
    <div class="tab-panel" id="panel-quiz"></div>
    <div class="tab-panel" id="panel-speak"></div>
  </div>
</div>

<!-- SETTINGS -->
<div class="page" id="page-settings">
  <div style="padding:16px 20px 60px;">
    <button class="back-btn" onclick="goHome()">← 홈으로</button>
    <h2 style="font-size:22px;font-weight:900;margin-bottom:22px;">⚙️ 설정</h2>
    <div class="sec-lbl">🎙 목소리 선택</div>
    <div class="voice-grid" id="vGrid"><span style="color:var(--muted);font-size:13px;">불러오는 중...</span></div>
    <div class="sec-lbl">🐢 말하기 속도</div>
    <div class="s-row">
      <div><div style="font-weight:700;font-size:14px;">재생 속도</div>
        <div style="font-size:12px;color:var(--muted);font-weight:600;margin-top:2px;">문장 읽기 속도</div></div>
      <div class="spd-btns">
        <button class="spd-btn" onclick="setSpd(0.65,this)">느리게</button>
        <button class="spd-btn active" onclick="setSpd(0.85,this)">보통</button>
        <button class="spd-btn" onclick="setSpd(1.05,this)">빠르게</button>
      </div>
    </div>
    <div class="sec-lbl">🔄 초기화</div>
    <button class="btn-p red" onclick="resetAll()">모든 진행 초기화</button>
  </div>
</div>

<!-- OVERLAY -->
<div class="overlay" id="ovl">
  <div class="ov-card">
    <div class="ov-ico" id="ovIco">🎉</div>
    <div class="ov-title" id="ovTitle"></div>
    <div class="ov-sub" id="ovSub"></div>
    <div class="ov-stats" id="ovStats"></div>
    <button class="btn-p" onclick="closeOvl()">계속 →</button>
  </div>
</div>

<script>
// ══════════════════════════════════════
// DATA
// ══════════════════════════════════════
const sections = [
  {
    id:'w1', title:'1주차', sub:'기본 표현',
    words:[
      {id:'w1_1',word:'例如',pinyin:'lì rú',meaning:'예를 들어',sentences:[
        {zh:'例如，我们可以用筷子吃饭。',py:'Lì rú, wǒmen kěyǐ yòng kuàizi chīfàn.',ko:'예를 들어, 우리는 젓가락으로 밥을 먹을 수 있어요.'},
        {zh:'很多水果含有维生素，例如苹果和橙子。',py:'Hěnduō shuǐguǒ hányǒu wéishēngsù, lì rú píngguǒ hé chéngzi.',ko:'많은 과일이 비타민을 함유해요, 예를 들어 사과와 오렌지.'},
        {zh:'你可以学很多语言，例如中文、英文。',py:'Nǐ kěyǐ xué hěnduō yǔyán, lì rú Zhōngwén, Yīngwén.',ko:'여러 언어를 배울 수 있어요, 예를 들어 중국어, 영어.'},
        {zh:'运动对身体有好处，例如跑步和游泳。',py:'Yùndòng duì shēntǐ yǒu hǎochù, lì rú pǎobù hé yóuyǒng.',ko:'운동은 몸에 좋아요, 예를 들어 달리기와 수영.'},
        {zh:'我有很多爱好，例如画画和听音乐。',py:'Wǒ yǒu hěnduō àihào, lì rú huàhuà hé tīng yīnyuè.',ko:'저는 취미가 많아요, 예를 들어 그림 그리기와 음악 듣기.'}
      ]},
      {id:'w1_2',word:'比如说',pinyin:'bǐ rú shuō',meaning:'예를 들자면',sentences:[
        {zh:'比如说，你可以每天练习说中文。',py:'Bǐ rú shuō, nǐ kěyǐ měitiān liànxí shuō Zhōngwén.',ko:'예를 들자면, 매일 중국어 말하기를 연습할 수 있어요.'},

// STATE

let xp=0, streak=1;
let selVoice=null, voices=[], spRate=0.85;
let curWid=null, curTab='learn';
let recog=null, isRec=false, spkMode='listen', spkSentI=0;
let listenedSents=new Set();
let prog=JSON.parse(localStorage.getItem('cnprog')||'{}');
function saveProg(){ localStorage.setItem('cnprog',JSON.stringify(prog)); }

function getState(wid){
  const p=prog[wid]||{};
  if(p.learn&&p.quiz&&p.speak)return 3;
  if(p.learn&&p.quiz)return 2;
  if(p.learn)return 1;
  return 0;
}
function mark(wid,key){
  if(!prog[wid])prog[wid]={};
  prog[wid][key]=true; saveProg();
  updateTabBtns();
}

// TTS
// ══════════════════════════════════════
function loadVoices(){
  voices=window.speechSynthesis.getVoices().filter(v=>v.lang.startsWith('zh'));
  if(!selVoice&&voices.length)selVoice=voices[0];
  renderVG();
}
window.speechSynthesis.onvoiceschanged=loadVoices;
setTimeout(loadVoices,400);

function renderVG(){
  const el=document.getElementById('vGrid'); if(!el||!voices.length)return;
  el.innerHTML=voices.map((v,i)=>`
    <div class="vchip ${selVoice===v?'active':''}" onclick="pickV(${i})">
      ${v.lang.includes('TW')||v.lang.includes('HK')?'🇹🇼':'🇨🇳'}
      ${v.name.replace('Microsoft ','').replace(' Online (Natural)','').replace('Google ','').split('(')[0].trim()}
    </div>`).join('');
}
function pickV(i){selVoice=voices[i];renderVG();}
function setSpd(r,btn){
  spRate=r;
  document.querySelectorAll('.spd-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
function tts(text,cb){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='zh-CN';u.rate=spRate;
  if(selVoice)u.voice=selVoice;
  if(cb)u.onend=cb;
  window.speechSynthesis.speak(u);
}

// HOME MAP  — canvas curve
// ══════════════════════════════════════
const ICO=['📖','💬','💪','➡️','👍','🤔','🤝','🎯','✅','🌟','💡','🔥'];
// X offsets from center (as fraction of container width)
const X_OFF=[0, -0.28, 0, 0.28, 0, -0.28, 0, 0.28, 0, -0.28, 0, 0.28];
const ROW_H=100, NODE_R=36, TOP_PAD=20;

function renderHome(){
  const home=document.getElementById('page-home');
  let html='';

  sections.forEach((sec,si)=>{
    const total=sec.words.length;
    const done=sec.words.filter(w=>getState(w.id)===3).length;
    const locked=si>0&&sections[si-1].words.some(w=>getState(w.id)<3);
    const mapH=TOP_PAD+total*ROW_H+20;

    html+=`<div class="section-block">
      <div class="section-banner ${locked?'locked':''}">
        <div>
          <div class="sb-title">${locked?'🔒 ':''}${sec.title}</div>
          <div class="sb-sub">${sec.sub} · ${total}개 표현</div>
        </div>
        ${done===total?'<div style="font-size:26px;">🏆</div>'
          :`<div class="sb-badge">${done}/${total} 완료</div>`}
      </div>
      <div class="map-container" style="height:${mapH}px;" id="mc${si}">
        <canvas class="map-canvas" id="cv${si}" height="${mapH}"></canvas>`;

    sec.words.forEach((w,wi)=>{
      const st=getState(w.id);
      const p=prog[w.id]||{};
      const cls=locked?'slk':'s'+st;
      const glow=!locked&&st<3?'glow':'';
      // positions set by JS after render
      html+=`<div class="word-node ${cls} ${glow}" id="nd_${w.id}"
          onclick="${locked?'':'openWord(\''+w.id+'\')'}" style="left:0;top:0;">
          <div class="n-ico">${st===3?'✅':ICO[wi%ICO.length]}</div>
          <div class="n-lbl ${locked||st===0?'dim':''}">${w.word}</div>
          <div class="node-dots">
            <div class="dot ${p.learn?'dl':'de'}"></div>
            <div class="dot ${p.quiz?'dq':'de'}"></div>
            <div class="dot ${p.speak?'ds':'de'}"></div>
          </div>
        </div>`;
    });

    html+=`</div></div>`;
  });

  html+=`<div class="map-legend">
    <span>⚪ 미완료</span>
    <span style="color:var(--blue);">🔵 학습</span>
    <span style="color:var(--yellow);">🟡 퀴즈</span>
    <span style="color:var(--green);">🟢 완료</span>
  </div>`;

  home.innerHTML=html;

  // Position nodes + draw curves after DOM paint
  requestAnimationFrame(()=>{
    sections.forEach((sec,si)=>{
      const mc=document.getElementById('mc'+si);
      if(!mc)return;
      const W=mc.offsetWidth;
      const cx=W/2;

      const pts=sec.words.map((w,wi)=>({
        x: cx + X_OFF[wi%X_OFF.length]*W,
        y: TOP_PAD + wi*ROW_H + NODE_R
      }));

      // position each node
      sec.words.forEach((w,wi)=>{
        const el=document.getElementById('nd_'+w.id);
        if(!el)return;
        el.style.left=(pts[wi].x-NODE_R)+'px';
        el.style.top=(pts[wi].y-NODE_R)+'px';
      });

      // draw smooth curve on canvas
      const cv=document.getElementById('cv'+si);
      if(!cv||pts.length<2)return;
      cv.width=W;
      const ctx=cv.getContext('2d');
      ctx.clearRect(0,0,W,cv.height);
      ctx.strokeStyle='#C8DFF0';
      ctx.lineWidth=4;
      ctx.setLineDash([8,7]);
      ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(pts[0].x,pts[0].y);
      for(let i=0;i<pts.length-1;i++){
        const p0=pts[i],p1=pts[i+1];
        const my=(p0.y+p1.y)/2;
        ctx.bezierCurveTo(p0.x,my, p1.x,my, p1.x,p1.y);
      }
      ctx.stroke();
    });
  });
}

// WORD DETAIL
// ══════════════════════════════════════
function getWord(wid){ for(const s of sections){const w=s.words.find(x=>x.id===wid);if(w)return w;} }
function allWords(){ return sections.flatMap(s=>s.words); }

function openWord(wid){
  curWid=wid; listenedSents=new Set(); curTab='learn';
  const w=getWord(wid);
  document.getElementById('wh-zh').textContent=w.word;
  document.getElementById('wh-py').textContent=w.pinyin;
  document.getElementById('wh-ko').textContent=w.meaning;
  showPage('page-word');
  updateTabBtns();
  renderLearn();
}

function updateTabBtns(){
  const p=prog[curWid]||{};
  ['learn','quiz','speak'].forEach(t=>{
    const btn=document.getElementById('tab-'+t);
    const key=t==='learn'?'learn':t==='quiz'?'quiz':'speak';
    const done=p[key];
    const active=curTab===t;
    btn.className='tab-btn'+(active?' active':'')+(done?' done':'');
  });
}

function switchTab(tab){
  curTab=tab;
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+tab).classList.add('active');
  updateTabBtns();
  if(tab==='learn') renderLearn();
  else if(tab==='quiz') startQuiz();
  else if(tab==='speak'){ spkSentI=0; spkMode='listen'; renderSpk(); }
}

// ── LEARN ──
function renderLearn(){
  const w=getWord(curWid);
  let html=`<div style="font-size:11px;font-weight:800;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-bottom:12px;">예시 문장 ${w.sentences.length}개</div>`;
  w.sentences.forEach((s,i)=>{
    const heard=listenedSents.has(i);
    html+=`<div class="sent-card" id="sc${i}">
      <div class="s-zh">${s.zh}</div>
      <div class="s-py">${s.py}</div>
      <div class="s-ko">${s.ko}</div>
      <button class="btn-listen ${heard?'heard':''}" onclick="listenS(${i},event)">
        ${heard?'✅ 들었어요':'🔊 듣기'}
      </button>
    </div>`;
  });
  document.getElementById('panel-learn').innerHTML=html;
}

function listenS(i,e){
  e.stopPropagation();
  const w=getWord(curWid);
  document.querySelectorAll('.sent-card').forEach(el=>el.classList.remove('playing'));
  const card=document.getElementById('sc'+i);
  card.classList.add('playing');
  const btn=card.querySelector('.btn-listen');
  btn.className='btn-listen heard'; btn.textContent='✅ 들었어요';
  listenedSents.add(i);
  tts(w.sentences[i].zh,()=>{
    card.classList.remove('playing');
    if(!(prog[curWid]?.learn) && listenedSents.size>=w.sentences.length){
      mark(curWid,'learn'); addXP(10);
      showToast('📖 학습 완료! +10 XP');
    }
  });
}

// ── QUIZ ──
let qQ=[],qI=0,qOk=0,qAns=false,qWrong=[],qRound=1,qTotalOk=0,qTotalCount=0;

function startQuiz(){
  const w=getWord(curWid);
  qQ=w.sentences.map((s,i)=>({type:i%2===0?'blank':'meaning',w,s}));
  qQ.sort(()=>Math.random()-.5);
  qI=0;qOk=0;qAns=false;qWrong=[];qRound=1;qTotalOk=0;qTotalCount=0;
  renderQ();
}

function renderQ(){
  const cont=document.getElementById('panel-quiz');
  if(qI>=qQ.length){
    qTotalOk+=qOk; qTotalCount+=qQ.length;
    if(qRound===1 && qWrong.length>0){
      qRound=2;
      const wrongQ=[...qWrong];
      qWrong=[];qOk=0;qI=0;qQ=wrongQ;
      cont.innerHTML=`
        <div style="text-align:center;padding:32px 16px;">
          <div style="font-size:44px;margin-bottom:14px;">🔄</div>
          <div style="font-size:18px;font-weight:900;color:var(--text);margin-bottom:8px;">틀린 문제 다시 풀기</div>
          <div style="font-size:14px;color:var(--muted);font-weight:600;margin-bottom:24px;">${wrongQ.length}개 문제를 다시 풀어볼게요!</div>
          <button class="btn-p" onclick="renderQ()">시작 →</button>
        </div>`;
      return;
    }
    const wasDone=prog[curWid]?.quiz;
    mark(curWid,'quiz');
    if(!wasDone) addXP(20);
    showOvl('✏️ 퀴즈 완료!',`${qTotalOk}/${qTotalCount} 정답`,
      [{v:qTotalOk,l:'정답'},{v:qTotalCount-qTotalOk,l:'오답'},{v:Math.round(qTotalOk/qTotalCount*100)+'%',l:'정확도'}]);
    return;
  }
  const {type,w,s}=qQ[qI];
  const pct=Math.round(qI/qQ.length*100);
  const others=allWords().filter(x=>x.id!==w.id).sort(()=>Math.random()-.5).slice(0,3);
  let qhtml='',correct='',choices=[];
  const retryBadge=qRound===2?'<span style="background:rgba(255,75,75,.12);color:var(--red);font-size:10px;font-weight:800;padding:2px 8px;border-radius:100px;margin-right:6px;">🔄 재도전</span>':'';
  if(type==='blank'){
    const bl=s.zh.replace(w.word,`<span class="blank" id="blk">${'\u3000'.repeat(Math.max(2,w.word.length))}</span>`);
    qhtml=`<div class="qbadge" style="${qRound===2?'background:rgba(255,75,75,.1);color:var(--red);':''}">${retryBadge}빈칸 채우기</div><div class="qq">${bl}</div>
      <div style="font-size:12px;color:var(--muted);font-weight:600;margin-bottom:12px;">${s.ko}</div>`;
    correct=w.word; choices=[correct,...others.map(x=>x.word)].sort(()=>Math.random()-.5);
  } else {
    qhtml=`<div class="qbadge" style="${qRound===2?'background:rgba(255,75,75,.1);color:var(--red);':''}">${retryBadge}뜻 고르기</div>
      <div class="qq" style="font-family:'Noto Sans SC',sans-serif;font-size:22px;">${w.word}</div>
      <div style="font-size:12px;color:var(--muted);font-weight:600;margin-bottom:12px;">${s.zh}</div>`;
    correct=w.meaning; choices=[correct,...others.map(x=>x.meaning)].sort(()=>Math.random()-.5);
  }
  const ch=choices.map(c=>`<button class="choice" onclick="checkA(this,'${c.replace(/'/g,"\'")}','${correct.replace(/'/g,"\'")}')">
    <span ${type==='blank'?'style="font-family:\'Noto Sans SC\',sans-serif;"':''}>${c}</span></button>`).join('');
  cont.innerHTML=`
    <div class="quiz-top">
      <div class="pbar"><div class="pfill" style="width:${pct}%"></div></div>
      <span style="font-size:12px;font-weight:800;color:${qRound===2?'var(--red)':'var(--muted)'};">${qI+1}/${qQ.length}</span>
    </div>
    <div style="background:#fff;border-radius:16px;padding:18px;border:2px solid ${qRound===2?'rgba(255,75,75,.3)':'var(--border)'};margin-bottom:12px;">
      ${qhtml}<div class="choices">${ch}</div>
    </div>
    <div class="rbox" id="rb"><div class="rtitle" id="rt"></div><div class="rdetail" id="rd"></div></div>
    <button class="btn-p" id="nxtBtn" style="display:none" onclick="nextQ()">계속 →</button>`;
}

function checkA(btn,chosen,correct){
  if(qAns)return; qAns=true;
  const ok=chosen===correct;
  document.querySelectorAll('.choice').forEach(b=>{
    b.disabled=true;
    if(b.querySelector('span').textContent.trim()===correct)b.classList.add('ok');
  });
  if(!ok){
    btn.classList.add('ng');
    if(qRound===1) qWrong.push(qQ[qI]);
  }
  const rb=document.getElementById('rb');
  rb.className='rbox show '+(ok?'ok':'ng');
  document.getElementById('rt').textContent=ok?'🎉 정답이에요!':'❌ 틀렸어요';
  document.getElementById('rd').textContent='정답: '+correct;
  if(ok){qOk++;addXP(5);}
  document.getElementById('nxtBtn').style.display='block';
  const blk=document.getElementById('blk');if(blk)blk.textContent=correct;
}
function nextQ(){qAns=false;qI++;renderQ();}

  if(spkMode==='listen') tts(s.zh);
}

function setSpkMode(m){ spkMode=m; renderSpk(); }
function prevSpk(){ if(spkSentI>0){spkSentI--;renderSpk();} }
function nextSpk(){ const w=getWord(curWid);if(spkSentI<w.sentences.length-1){spkSentI++;renderSpk();} }

function togRec(){
  if(isRec){stopRec();return;}
  if(!('webkitSpeechRecognition'in window)&&!('SpeechRecognition'in window)){simRec();return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recog=new SR();recog.lang='zh-CN';recog.interimResults=false;
  recog.onresult=e=>handleSpk(e.results[0][0].transcript);
  recog.onerror=()=>{stopRec();const el=document.getElementById('spkSt');if(el)el.textContent='다시 시도해 주세요';};
  recog.start();isRec=true;
  const b=document.getElementById('micB');b.classList.add('rec');b.textContent='⏹';
  const st=document.getElementById('spkSt');if(st)st.textContent='듣고 있어요...';
}
function stopRec(){
  if(recog)recog.stop();isRec=false;
  const b=document.getElementById('micB');if(b){b.classList.remove('rec');b.textContent='🎤';}
}
function simRec(){
  isRec=true;
  const b=document.getElementById('micB');b.classList.add('rec');b.textContent='⏹';
  const st=document.getElementById('spkSt');if(st)st.textContent='시뮬레이션 중...';
  setTimeout(()=>{const w=getWord(curWid);handleSpk(w.sentences[spkSentI%w.sentences.length].zh);},1800);
}
function handleSpk(transcript){
  stopRec();
  const w=getWord(curWid);const s=w.sentences[spkSentI%w.sentences.length];
  const sim=calcSim(s.zh.replace(/[，。？！]/g,''),transcript.replace(/[，。？！]/g,''));
  const pct=Math.round(sim*100);
  const st=document.getElementById('spkSt');const res=document.getElementById('spkR');
  if(!st||!res)return;
  res.classList.add('show');
  if(pct>=75){
    st.textContent=`🎉 ${pct}% 정확도`;st.className='spk-st good';
    res.innerHTML=`✅ "${transcript}"<br><span style="color:var(--green)">훌륭해요!</span>`;
    addXP(8);
  } else if(pct>=45){
    st.textContent=`👍 ${pct}% 정확도`;st.className='spk-st good';
    res.innerHTML=`⚠️ "${transcript}"<br>정답: ${s.zh}`;addXP(4);
  } else {
    st.textContent=`다시 해봐요! ${pct}%`;st.className='spk-st bad';
    res.innerHTML=`❌ "${transcript}"<br>정답: ${s.zh}<br><span style="color:var(--blue)">${s.py}</span>`;
  }
  // auto-complete speak on first attempt
  if(!prog[curWid]?.speak){
    mark(curWid,'speak'); addXP(15);
    showToast('🎤 말하기 완료! +15 XP');
    const p=prog[curWid]||{};
    if(p.learn&&p.quiz&&p.speak){
      setTimeout(()=>showOvl('🏅 단어 마스터!',w.word+' 완전 정복!',
        [{v:'📖',l:'학습'},{v:'✏️',l:'퀴즈'},{v:'🎤',l:'말하기'}]),2500);
    }
  }
}
function calcSim(a,b){if(!a||!b)return 0;let m=0;for(const c of a){if(b.includes(c))m++;}return m/Math.max(a.length,b.length);}

// ══════════════════════════════════════
// OVERLAY + TOAST
// ══════════════════════════════════════
function showOvl(title,sub,stats){
  document.getElementById('ovIco').textContent=title.includes('마스터')?'🏅':'🎉';
  document.getElementById('ovTitle').textContent=title;
  document.getElementById('ovSub').textContent=sub;
  document.getElementById('ovStats').innerHTML=stats.map(s=>`
    <div class="ov-stat"><div class="ov-val">${s.v}</div><div class="ov-lbl">${s.l}</div></div>`).join('');
  document.getElementById('ovl').classList.add('show');
}
function closeOvl(){
  document.getElementById('ovl').classList.remove('show');
  updateTabBtns();
}

function showToast(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),2200);
}

// ══════════════════════════════════════
// XP + UTILS
// ══════════════════════════════════════
function addXP(n){
  xp+=n;document.getElementById('xXp').textContent=xp;
  const el=document.createElement('div');el.className='xp-pop';el.textContent='+'+n+' XP';
  document.body.appendChild(el);setTimeout(()=>el.remove(),1500);
}
function resetAll(){
  if(confirm('모든 진행 현황을 초기화할까요?')){
    prog={};saveProg();xp=0;document.getElementById('xXp').textContent=0;goHome();
  }
}

// ══════════════════════════════════════
// SWIPE BACK (좌→우 스와이프, 어디서든)
// ══════════════════════════════════════
(function(){
  let startX=0, startY=0;
  document.addEventListener('touchstart', e=>{
    startX=e.touches[0].clientX;
    startY=e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener('touchend', e=>{
    const dx=e.changedTouches[0].clientX - startX;
    const dy=Math.abs(e.changedTouches[0].clientY - startY);
    // 오른쪽으로 80px 이상, 세로 이동이 가로보다 적을 때
    if(dx > 80 && dy < dx * 0.6){
      const cur=document.querySelector('.page.active');
      if(cur && cur.id !== 'page-home') goHome();
    }
  }, {passive:true});
})();

// ══════════════════════════════════════
// INIT
// ══════════════════════════════════════
renderHome();
if('serviceWorker'in navigator){
  navigator.serviceWorker.register('/sw.js').then(reg=>{
    // 새 SW 있으면 즉시 활성화
    reg.addEventListener('updatefound',()=>{
      const nw=reg.installing;
      nw.addEventListener('statechange',()=>{
        if(nw.state==='installed'&&navigator.serviceWorker.controller){
          nw.postMessage({type:'SKIP_WAITING'});
        }
      });
    });
  }).catch(()=>{});
}
</script>
